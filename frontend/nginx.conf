server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de subida. Por defecto nginx corta en 1 MB (413), lo que rompía la
    # carga de videos (y de fotos grandes). Se sube a 110 MB, un poco por encima del
    # límite de 100 MB que aplica multer en el backend (upload.middleware.js).
    client_max_body_size 110M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://manhattan_backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Timeouts amplios: subir un video a Cloudinary puede tardar varios segundos.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://manhattan_backend:4000/uploads/;
    }
}
