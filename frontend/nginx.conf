# --- Prerender para bots sociales (17/08/2026, al conectar el dominio) ---
# Este archivo se copia a /etc/nginx/conf.d/default.conf, que nginx incluye DENTRO del
# bloque http{}, así que los `map` de acá son válidos (map es directiva de http).
#
# El problema: WhatsApp, Facebook, Instagram y Telegram no ejecutan JavaScript. Piden el
# HTML, leen los meta tags y se van. Como esta web es una SPA que arma todo en el cliente,
# a esos bots les llegaba un index.html sin contenido, y por eso el link de una propiedad
# compartido por WhatsApp aparecía como texto pelado, sin foto ni precio.
#
# La solución: detectarlos por User-Agent y mandarlos al prerender del backend, que les
# devuelve un HTML chico con los Open Graph de esa propiedad (ver seo.routes.js).
map $http_user_agent $seo_ua_is_social_bot {
    default 0;
    # Googlebot NO está en esta lista a propósito: sabe ejecutar JS e indexa la SPA bien.
    # Servirle a Google un HTML distinto al del visitante sería "cloaking" y es
    # penalizable. Los bots de acá abajo no indexan, solo arman la tarjeta del link.
    "~*(facebookexternalhit|WhatsApp|Twitterbot|Slackbot|LinkedInBot|TelegramBot|Discordbot|Pinterest|redditbot|SkypeUriPreview|vkShare|W3C_Validator)" 1;
}

# Segundo filtro: solo prerenderizar rutas de página, nunca archivos. Sin esto, un bot
# que pide /assets/index-abc123.js recibiría HTML en vez del bundle. Se distingue por la
# presencia de un punto en el path (todos los assets tienen extensión, las rutas no).
map $uri $seo_uri_is_page {
    default 1;
    "~\." 0;
}

# Solo se prerenderiza cuando se cumplen LAS DOS condiciones (bot social + ruta de página).
map "$seo_ua_is_social_bot$seo_uri_is_page" $seo_do_prerender {
    default 0;
    "11" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de subida. Por defecto nginx corta en 1 MB (413), lo que rompía la
    # carga de videos (y de fotos grandes). Se sube a 110 MB, un poco por encima del
    # límite de 100 MB que aplica multer en el backend (upload.middleware.js).
    client_max_body_size 110M;

    location / {
        # Si es un bot social pidiendo una página, se desvía al prerender del backend y
        # el try_files de abajo no llega a ejecutarse. Para un visitante real
        # $seo_do_prerender vale 0 y la SPA se sirve exactamente igual que siempre:
        # cero cambio de comportamiento y cero costo para el usuario final.
        # (El `if` con proxy_pass dentro de un location es uno de los usos soportados
        # de la directiva, no cae en los casos problemáticos del famoso "if is evil".)
        if ($seo_do_prerender) {
            proxy_pass http://manhattan_backend:4000/seo/prerender$uri;
        }
        try_files $uri $uri/ /index.html;
    }

    # sitemap.xml: lo genera el backend leyendo la base, así que cada propiedad nueva
    # que carga el admin aparece sola, sin rebuild ni redeploy. Se expone en la raíz
    # porque es donde lo buscan Google y el propio robots.txt.
    # robots.txt NO necesita location: es un archivo estático en public/ y lo sirve el
    # try_files de arriba.
    location = /sitemap.xml {
        proxy_pass http://manhattan_backend:4000/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Sin esto, el navegador puede cachear index.html (nginx manda Last-Modified/ETag
    # por default) y seguir sirviendo una versión vieja del shell de la SPA — que
    # apunta a un bundle JS que ya no existe tras el próximo build. Pasó justo con esto
    # (28/07/2026): páginas de propiedad visitadas antes de un rebuild se quedaron
    # corriendo JS viejo sin el tracking de vistas/consultas, aunque visualmente
    # cargaban bien porque los datos de la propiedad no dependen del bundle. Los
    # archivos hasheados de /assets/ SÍ pueden cachearse libremente (el hash cambia
    # solo si el contenido cambia), así que esto no los afecta.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://manhattan_backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For (11/08/2026): FALTABA, y sin él los rate limiters no servían.
        # El backend tiene `app.set('trust proxy', 1)`, así que express-rate-limit saca la
        # IP del visitante de este header. Como nginx no lo mandaba, pasaban dos cosas:
        #   1) El header llegaba tal cual lo mandaba el CLIENTE. Verificado con curl: con
        #      un `X-Forwarded-For` inventado y distinto en cada request, el contador
        #      arrancaba de cero siempre → el límite de intentos de login y el anti-spam
        #      de los formularios se salteaban por completo con una línea de código.
        #   2) Si el cliente no mandaba nada, express caía a la IP del socket, que es la
        #      del contenedor de nginx: TODOS los visitantes compartían un solo contador,
        #      así que 8 postulaciones en 10 minutos bloqueaban el formulario para todo
        #      el mundo (justo lo contrario de lo que el limiter quería hacer).
        # $proxy_add_x_forwarded_for agrega la IP real al final de lo que haya mandado el
        # cliente, y `trust proxy: 1` hace que express lea exactamente esa última — así lo
        # que el visitante invente adelante queda ignorado.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Timeouts amplios: subir un video a Cloudinary puede tardar varios segundos.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://manhattan_backend:4000/uploads/;
    }
}
