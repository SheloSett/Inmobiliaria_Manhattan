services:
  db:
    image: postgres:15
    container_name: manhattan_db
    environment:
      POSTGRES_USER: manhattan
      # POSTGRES_PASSWORD: manhattan123
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manhattan123}
      # ↑ Ambas comentadas. La primera era la contraseña fija original. La segunda (del
      #   10/08/2026) intentaba leerla del .env, pero el operador `:-` aplica el default
      #   tanto si la variable NO EXISTE como si existe pero está VACÍA — y el .env real
      #   tenía `POSTGRES_PASSWORD=` sin valor. Resultado: se usaba silenciosamente la
      #   contraseña "manhattan123", que está publicada en este repo (es público).
      #   Con `:?` compose ABORTA con un mensaje claro si falta el valor, en vez de
      #   arrancar con un secreto conocido creyendo que está configurado.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en el .env de la raíz, ver .env.example}"
      POSTGRES_DB: manhattan_db
    ports:
      # - "5434:5432"
      # ↑ Comentado: exponía Postgres a internet en el VPS. Con el prefijo
      #   127.0.0.1 el puerto solo es accesible desde la propia máquina
      #   (localmente seguís pudiendo conectarte igual que antes por 5434).
      - "127.0.0.1:5434:5432"
    volumes:
      - manhattan_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: manhattan_backend
    environment:
      # DATABASE_URL: postgresql://manhattan:manhattan123@db:5432/manhattan_db
      # JWT_SECRET: manhattan_secret_key_2024
      # DATABASE_URL: postgresql://manhattan:${POSTGRES_PASSWORD:-manhattan123}@db:5432/manhattan_db
      # JWT_SECRET: ${JWT_SECRET:-manhattan_secret_key_2024}
      # ↑ Comentadas por el mismo motivo que POSTGRES_PASSWORD arriba: con `:-` un .env
      #   con la variable vacía caía al default. En el caso del JWT_SECRET eso era lo más
      #   grave de todo: "manhattan_secret_key_2024" está en este repo público, y con esa
      #   clave cualquiera puede FIRMARSE un token de admin válido y entrar al panel sin
      #   saber ninguna contraseña. Ahora, sin valor en el .env, compose no levanta.
      # Los valores van entre comillas porque el mensaje de error de `:?` lleva ":" y sin
      # comillas YAML lo interpreta como un mapa anidado y no parsea el archivo.
      DATABASE_URL: "postgresql://manhattan:${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en el .env de la raíz}@db:5432/manhattan_db"
      JWT_SECRET: "${JWT_SECRET:?definí JWT_SECRET en el .env de la raíz, generalo con openssl rand -hex 32}"
      PORT: 4000
      NODE_ENV: production
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      # - "4000:4000"
      # - "127.0.0.1:4000:4000"
      # ↑ Comentadas: el backend no necesita estar expuesto a internet; el nginx
      #   del frontend le hace proxy por la red interna de Docker. Este mapeo a
      #   127.0.0.1 solo es útil para debug local y para el proxy de Vite en
      #   desarrollo. El puerto del host ahora es configurable (BACKEND_PORT)
      #   porque en algunos VPS el 4000 ya está tomado por otra app.
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: manhattan_frontend
    ports:
      # - "3000:80"
      # ↑ Comentado: el puerto público ahora es configurable. En desarrollo
      #   local sigue siendo 3000 (default); en el VPS se define
      #   FRONTEND_PORT=80 en el .env raíz para servir la web en el puerto 80.
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  manhattan_data:
